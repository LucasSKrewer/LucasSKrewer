  </defs>

  <rect width="1000" height="200" fill="#0d1117"/>
  <rect width="1000" height="200" fill="url(#ad-grid)"/>

  <!-- marca de margem -->
  <rect x="44" y="58" width="5" height="36" fill="#E8913A"/>

  <text x="68" y="90" fill="#E6EDF3"
        font-family="SFMono-Regular, 'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace"
        font-size="42" letter-spacing="-0.5">LucasSKrewer</text>

  <line x1="68" y1="114" x2="660" y2="114" stroke="#21262D" stroke-width="1"/>

  <text x="68" y="143" fill="#8B949E"
        font-family="SFMono-Regular, 'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace"
