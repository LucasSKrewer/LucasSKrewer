        font-size="16">mods de jogos &#183; C++ &#183; netcode</text>

  <!-- motivo: relay de estado host <-> peers -->
  <g stroke="#30363D" stroke-width="1.2" fill="none">
    <line x1="893" y1="100" x2="800" y2="53"/>
    <line x1="893" y1="100" x2="776" y2="100"/>
    <line x1="893" y1="100" x2="800" y2="147"/>
  </g>
  <path d="M 800 53 Q 958 100 800 147" fill="none" stroke="#E8913A" stroke-width="1.4" opacity="0.85"/>
  <g fill="#0d1117" stroke="#546069" stroke-width="1.4">
    <circle cx="800" cy="53" r="5.5"/>
    <circle cx="776" cy="100" r="5.5"/>
    <circle cx="800" cy="147" r="5.5"/>
  </g>
  <circle cx="893" cy="100" r="8" fill="#E8913A"/>
</svg>
